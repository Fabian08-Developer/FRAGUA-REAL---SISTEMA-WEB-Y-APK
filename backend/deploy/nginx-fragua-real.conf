# Endurecimiento (13/10/2026) — Nginx para el VPS de Hostinger (decisión D2).
# Despliegue (15/10/2026): este archivo NO carga sin el certificado (el bloque 443 lo exige). La
# primera vez se usa nginx-fragua-real-inicial.conf para sacarlo con Certbot (webroot) y luego se
# reemplaza por este (README-ENTREGA, paso 5):
#   sudo cp nginx-fragua-real.conf /etc/nginx/sites-available/fragua-real
#   sudo nginx -t && sudo systemctl reload nginx
# Ajustar el dominio, las rutas y el socket de PHP-FPM si no son estos.
# No usar `certbot --nginx`: reescribe este archivo. La renovación (certbot renew, automática) usa la
# carpeta /var/www/certbot del bloque de abajo y recarga Nginx sola.
#
# Un solo dominio: el sitio (Vue, carpeta frontend/dist) y la API de Laravel en /api. Así el
# navegador no necesita CORS y la sesión nunca sale del dominio.

# Todo lo que llega por http se manda a https, menos la comprobación de Let's Encrypt (renovaciones).
server {
    listen 80;
    listen [::]:80;
    server_name fraguareal.co www.fraguareal.co;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://fraguareal.co$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fraguareal.co www.fraguareal.co;

    ssl_certificate     /etc/letsencrypt/live/fraguareal.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fraguareal.co/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # No decir qué versión de Nginx corre.
    server_tokens off;

    # Soportes de compras y gastos: hasta 5 MB por archivo (README-BACKEND, punto 25), con margen.
    client_max_body_size 8m;

    root /var/www/fragua-real/frontend/dist;
    index index.html;

    # ---- Cabeceras de seguridad del sitio ----
    # HSTS: el navegador solo entra por https durante un año (después de confirmar que https funciona).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 26/10/2026: geolocation=(self) para «Usar mi ubicación actual» del domicilio (antes geolocation=()
    # la bloqueaba en producción). La cámara del cobro usa el selector de archivos, que no depende de esto.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;
    # CSP: la sesión vive en el navegador (localStorage), así que solo se ejecuta el código propio.
    #  - script-src 'self': ningún script de afuera ni en línea.
    #  - style-src: las fuentes de Google y los estilos en línea que pone Vue.
    #  - img-src https:: las fotos de productos pueden ser enlaces a otra página.
    #  - connect-src 'self': la API va en el mismo dominio.
    #  - frame-src 'self': la impresión del QR de mesa usa un marco propio, en blanco.
    #  - form-action / frame-ancestors: nadie incrusta el sitio ni le roba un formulario.
    # El pago con Wompi es una redirección a checkout.wompi.co, no lo afecta.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    # Archivos ocultos (.env, .git…) nunca se sirven.
    location ~ /\.(?!well-known) {
        deny all;
    }

    # ---- API de Laravel ----
    location ^~ /api {
        root /var/www/fragua-real/backend/public;
        try_files $uri /index.php?$query_string;
    }

    location = /index.php {
        root /var/www/fragua-real/backend/public;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    # Ningún otro .php se ejecuta.
    location ~ \.php$ {
        return 404;
    }

    # ---- Sitio (Vue) ----
    # Archivos con huella en el nombre (los de /assets): caché larga.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        # add_header dentro de un location reemplaza los de arriba: se repiten los de seguridad.
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Mejora (16/10/2026): app instalable (PWA). El service worker y el manifiesto se revisan siempre
    # contra el servidor, para que una versión nueva llegue de inmediato a los teléfonos.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Cualquier otra ruta (/menu, /seguimiento/..., /pago/retorno/...) la resuelve la aplicación.
    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/fragua-real.access.log;
    error_log /var/log/nginx/fragua-real.error.log warn;
}

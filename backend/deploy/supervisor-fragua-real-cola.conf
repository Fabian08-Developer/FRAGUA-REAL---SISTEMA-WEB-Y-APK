; Fase 4, tarea 1 — Trabajador de la cola de Fragua Real (avisos, recordatorios, latido).
; Copiar a /etc/supervisor/conf.d/fragua-real-cola.conf en el VPS y ajustar la ruta y el
; usuario si no son estos. Luego:
;   sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl start fragua-real-cola:*
; Tras cada despliegue del código:  php artisan queue:restart  (Supervisor lo vuelve a levantar).
[program:fragua-real-cola]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/fragua-real/backend/artisan queue:work database --sleep=3 --tries=3 --backoff=60 --max-time=3600
directory=/var/www/fragua-real/backend
user=www-data
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/www/fragua-real/backend/storage/logs/cola.log

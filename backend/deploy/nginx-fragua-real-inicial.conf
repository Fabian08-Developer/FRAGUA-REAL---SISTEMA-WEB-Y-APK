# Despliegue (15/10/2026) — Nginx SOLO para sacar el certificado HTTPS la primera vez.
# nginx-fragua-real.conf no carga sin certificado (el bloque 443 lo exige), así que primero va este:
#
#   sudo mkdir -p /var/www/certbot
#   sudo cp nginx-fragua-real-inicial.conf /etc/nginx/sites-available/fragua-real
#   sudo ln -s /etc/nginx/sites-available/fragua-real /etc/nginx/sites-enabled/fragua-real
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot certonly --webroot -w /var/www/certbot -d fraguareal.co -d www.fraguareal.co \
#        --deploy-hook "systemctl reload nginx"
#
# Con el certificado ya emitido, reemplazar este archivo por nginx-fragua-real.conf (README-ENTREGA,
# paso 5). Ajustar el dominio si no es este.

server {
    listen 80;
    listen [::]:80;
    server_name fraguareal.co www.fraguareal.co;

    server_tokens off;

    # Certbot deja aquí el archivo con el que Let's Encrypt comprueba que el dominio es nuestro.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 404;
    }
}

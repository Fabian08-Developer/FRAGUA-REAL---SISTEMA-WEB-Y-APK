<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" />
    <!-- viewport-fit=cover: deja que la barra inferior móvil del Mesero respete el área
         segura (la "isla"/barra de gestos) de iPhone y Android con env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#171510" />
    <title>Fragua Real Burger</title>
    <!-- Mejora (16/10/2026): app instalable (PWA). Manifiesto, ícono para la pantalla de inicio del
         iPhone y modo de pantalla completa al abrirla desde el ícono. -->
    <meta name="description" content="Pide a domicilio o para recoger y reserva tu mesa en Fragua Real Burger." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/iconos/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Fragua Real" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Tipografías del diseño (Figma "Fragua Real Diseños V1"): Playfair Display
         para títulos, DM Sans para cuerpo/UI. Se cargan también los pesos 600/700 de
         DM Sans y 700 de Playfair — los paneles de Mesero/Admin usan font-semibold/bold,
         y sin esos pesos el navegador los "inventa" (negrita sintética, más borrosa). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

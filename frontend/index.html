<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" />
    <!-- viewport-fit=cover: deja que la barra inferior móvil del Mesero respete el área
         segura (la "isla"/barra de gestos) de iPhone y Android con env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#171510" />
    <title>Fragua Real Burger · Donde la vida sabe mejor</title>
    <!-- Mejora (16/10/2026): app instalable (PWA). Manifiesto, ícono para la pantalla de inicio del
         iPhone y modo de pantalla completa al abrirla desde el ícono. -->
    <meta name="description" content="Fragua Real Burger, donde la vida sabe mejor. Pide a domicilio o para recoger y reserva tu mesa." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/iconos/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Fragua Real" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Tipografías: Fraunces para títulos y Outfit para textos y paneles (29/10/2026; antes Playfair
         Display y DM Sans). Se cargan los pesos 400 a 700 de las dos — los paneles de Mesero/Admin usan
         font-semibold/bold, y sin esos pesos el navegador los "inventa" (negrita sintética, más borrosa). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
